# The whole platform with one command, the same image that runs on Render:
#   docker compose up --build        then open http://localhost:8000
# First time only, copy your local data into the container database: scripts/copy-db-to-docker.sh
# Stop the local uvicorn (port 8000) first; the app container uses that port.
name: pr-risk

services:
  db:
    # PostgreSQL 16 with the pgvector extension (needed for the RAG document embeddings)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pr_risk_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr_risk_local}
      POSTGRES_DB: pr_risk_dev
    ports:
      - "5433:5432" # 5433 on the Mac, because the Homebrew PostgreSQL already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_risk_app -d pr_risk_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: . # the Dockerfile in the repo root: React build + FastAPI in one image
    env_file: backend/.env # GitHub OAuth, JWT and encryption keys, PUBLIC_REPOS, same as running it locally
    environment:
      # Inside Docker the database is the `db` service, and the app itself is the site on port 8000
      DATABASE_URL: postgresql+psycopg://pr_risk_app:${POSTGRES_PASSWORD:-pr_risk_local}@db:5432/pr_risk_dev
      FRONTEND_URL: http://localhost:8000
    ports:
      - "8000:8000" # same port as before, so the GitHub OAuth callback URL does not change
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
