# Phase 18b: the whole platform with one command.
#   docker compose up --build        then open http://localhost:5173
# First time only, copy your local data into the container database: scripts/copy-db-to-docker.sh
# Stop the local uvicorn (port 8000) and `npm run dev` (port 5173) first; the containers use those ports.
name: pr-risk

services:
  db:
    # PostgreSQL 16 with the pgvector extension (needed for the RAG document embeddings)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pr_risk_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr_risk_local}
      POSTGRES_DB: pr_risk_dev
    ports:
      - "5433:5432" # 5433 on the Mac, because the Homebrew PostgreSQL already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_risk_app -d pr_risk_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: backend/.env # GitHub OAuth, JWT and encryption keys, same as running it locally
    environment:
      # Overrides DATABASE_URL from backend/.env: inside Docker the database is the `db` service
      DATABASE_URL: postgresql+psycopg://pr_risk_app:${POSTGRES_PASSWORD:-pr_risk_local}@db:5432/pr_risk_dev
    ports:
      - "8000:8000" # same port as before, so the GitHub OAuth callback URL does not change
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000 # the browser calls the API on the Mac's port 8000
    ports:
      - "5173:80" # same port as `npm run dev`, which the backend allows (CORS) and returns to after login
    depends_on:
      - backend

volumes:
  pgdata:
