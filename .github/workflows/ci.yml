# Phase 18: runs both test suites on every pull request and on every push to main.
# A red cross on a PR means something broke; GitHub shows which step and why.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway PostgreSQL 16 just for this run. Its name ends in _test, as the tests require.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pr_risk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pr_risk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/pr_risk_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-dev.txt
      # The light list: the API and its tests, without torch / transformers (see requirements-api.txt)
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Frontend lint, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # also type-checks with tsc
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # If a browser test fails, keep its trace so it can be replayed with `npx playwright show-trace`
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
